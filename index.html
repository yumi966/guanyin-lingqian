<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10251e">
<meta name="description" content="观音灵签，静心一问。传统文化与自我反思工具。">
<title>观音灵签 · 静心一问</title>
<style>
  :root{
    --night:#10251e;
    --night-deep:#091611;
    --night-soft:#19382f;
    --paper:#f3ecd9;
    --paper-light:#faf6e9;
    --paper-deep:#e4d8bf;
    --ink:#202a24;
    --muted:#706b5e;
    --gold:#b3925e;
    --gold-soft:rgba(179,146,94,.35);
    --cinnabar:#a43b29;
    --cinnabar-deep:#7d291f;
    --jade:#7d9b90;
    --line:rgba(42,54,44,.15);
    --display:"Songti SC","Noto Serif CJK SC","STSong","SimSun",serif;
    --body:"FangSong","STFangsong","KaiTi","Kaiti SC","Noto Serif CJK SC",serif;
    --sans:"FZLanTingHeiS-R-GB","PingFang SC","Microsoft YaHei",sans-serif;
  }

  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    min-width:0;
    margin:0;
    color:var(--paper);
    background:
      linear-gradient(118deg,rgba(112,148,131,.08),transparent 34%),
      linear-gradient(302deg,rgba(164,59,41,.045),transparent 30%),
      linear-gradient(155deg,var(--night-soft) 0%,var(--night) 42%,var(--night-deep) 100%);
    font-family:var(--body);
    line-height:1.75;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-1;
    pointer-events:none;
    opacity:.42;
    background-image:
      repeating-linear-gradient(90deg,transparent 0 95px,rgba(230,218,191,.035) 96px),
      repeating-linear-gradient(0deg,transparent 0 95px,rgba(230,218,191,.025) 96px);
    mask-image:linear-gradient(to bottom,black,transparent 82%);
  }

  button,
  textarea{
    font:inherit;
  }

  button{
    -webkit-tap-highlight-color:transparent;
  }

  button:focus-visible,
  textarea:focus-visible,
  summary:focus-visible{
    outline:2px solid var(--gold);
    outline-offset:3px;
  }

  .page{
    width:min(1180px,calc(100% - 48px));
    margin:0 auto;
    padding:28px 0 48px;
  }

  .masthead{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
    padding:0 2px 24px;
    border-bottom:1px solid rgba(228,216,191,.16);
    animation:rise-in .65s cubic-bezier(.2,.8,.2,1) both;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:15px;
  }

  .brand-seal{
    position:relative;
    display:grid;
    place-items:center;
    width:48px;
    height:56px;
    color:var(--paper-light);
    background:var(--cinnabar);
    border:1px solid rgba(255,255,255,.2);
    font-family:var(--display);
    font-size:1.55rem;
    line-height:1;
    box-shadow:inset 0 0 0 4px rgba(105,28,20,.16),0 8px 30px rgba(0,0,0,.15);
    transform:rotate(-1.5deg);
  }

  .brand-seal::before,
  .brand-seal::after{
    content:"";
    position:absolute;
    background:rgba(250,246,233,.18);
  }

  .brand-seal::before{
    width:1px;
    inset:7px auto 7px 50%;
  }

  .brand-seal::after{
    height:1px;
    inset:50% 7px auto;
  }

  .brand-eyebrow{
    margin:0 0 1px;
    color:var(--gold);
    font-family:var(--sans);
    font-size:.68rem;
    letter-spacing:.34em;
  }

  .brand h1{
    margin:0;
    color:var(--paper-light);
    font-family:var(--display);
    font-size:1.65rem;
    font-weight:500;
    letter-spacing:.16em;
    line-height:1.35;
  }

  .header-note{
    display:flex;
    align-items:center;
    gap:12px;
    color:rgba(243,236,217,.55);
    font-size:.78rem;
    letter-spacing:.15em;
  }

  .header-note i{
    width:34px;
    height:1px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
  }

  .app-shell{
    display:grid;
    grid-template-columns:minmax(320px,.82fr) minmax(0,1.38fr);
    gap:28px;
    align-items:start;
    padding-top:28px;
  }

  .query-column{
    min-width:0;
    animation:rise-in .72s .08s cubic-bezier(.2,.8,.2,1) both;
  }

  .query-deck{
    position:relative;
    overflow:hidden;
    padding:29px 27px 26px;
    color:var(--ink);
    background:
      linear-gradient(135deg,rgba(255,255,255,.46),transparent 35%),
      var(--paper);
    border:1px solid rgba(255,255,255,.22);
    border-radius:4px;
    box-shadow:0 28px 70px rgba(0,0,0,.23),inset 0 0 0 5px rgba(255,255,255,.17);
  }

  .query-deck::before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:.2;
    background:
      repeating-linear-gradient(0deg,transparent 0 27px,rgba(72,62,46,.12) 28px),
      radial-gradient(circle at 12% 0%,rgba(255,255,255,.8),transparent 35%);
    mix-blend-mode:multiply;
  }

  .query-deck > *{
    position:relative;
    z-index:1;
  }

  .section-kicker{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:11px;
    color:var(--cinnabar);
    font-family:var(--sans);
    font-size:.72rem;
    letter-spacing:.26em;
  }

  .section-kicker span{
    display:grid;
    place-items:center;
    width:24px;
    height:24px;
    border:1px solid currentColor;
    border-radius:50%;
    font-size:.67rem;
    letter-spacing:0;
  }

  .query-deck h2{
    margin:0;
    font-family:var(--display);
    font-size:1.6rem;
    font-weight:600;
    letter-spacing:.08em;
    line-height:1.45;
  }

  .query-intro{
    margin:8px 0 23px;
    color:var(--muted);
    font-size:.91rem;
    line-height:1.8;
  }

  .cats{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:8px;
  }

  .cat{
    position:relative;
    display:flex;
    align-items:center;
    gap:9px;
    min-height:48px;
    padding:10px 11px;
    color:#39433b;
    background:rgba(255,255,255,.34);
    border:1px solid rgba(47,59,49,.18);
    border-radius:2px;
    cursor:pointer;
    text-align:left;
    transition:color .2s ease,border-color .2s ease,background .2s ease,transform .2s ease;
  }

  .cat:hover{
    color:var(--cinnabar-deep);
    border-color:rgba(164,59,41,.48);
    background:rgba(255,255,255,.58);
    transform:translateY(-1px);
  }

  .cat-index{
    color:rgba(84,78,64,.46);
    font-family:var(--sans);
    font-size:.62rem;
    letter-spacing:.08em;
    transition:color .2s ease;
  }

  .cat-name{
    font-size:.94rem;
    letter-spacing:.05em;
  }

  .cat.on{
    color:var(--paper-light);
    background:var(--cinnabar);
    border-color:var(--cinnabar);
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.12);
  }

  .cat.on .cat-index{
    color:rgba(250,246,233,.62);
  }

  .cat.on::after{
    content:"";
    position:absolute;
    top:7px;
    right:7px;
    width:5px;
    height:5px;
    background:var(--paper-light);
    border-radius:50%;
  }

  .question-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    margin:23px 0 8px;
    color:#39433b;
    font-size:.9rem;
    letter-spacing:.04em;
  }

  .question-head em{
    margin-left:7px;
    color:rgba(84,78,64,.62);
    font-family:var(--sans);
    font-size:.68rem;
    font-style:normal;
    letter-spacing:.08em;
  }

  .question-count{
    color:rgba(84,78,64,.55);
    font-family:var(--sans);
    font-size:.66rem;
    letter-spacing:.04em;
  }

  .question-input{
    display:block;
    width:100%;
    min-height:86px;
    padding:11px 12px;
    color:var(--ink);
    background:
      repeating-linear-gradient(0deg,transparent 0 25px,rgba(57,67,59,.12) 26px),
      rgba(255,255,255,.28);
    border:1px solid rgba(47,59,49,.18);
    border-radius:2px;
    outline:none;
    resize:vertical;
    font-family:var(--body);
    font-size:.95rem;
    line-height:26px;
    transition:border-color .2s ease,background .2s ease;
  }

  .question-input::placeholder{
    color:rgba(84,78,64,.46);
  }

  .question-input:focus{
    border-color:var(--cinnabar);
    background-color:rgba(255,255,255,.5);
    outline:none;
  }

  .draw-button{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    min-height:62px;
    margin-top:16px;
    padding:10px 13px 10px 17px;
    overflow:hidden;
    color:var(--paper-light);
    background:var(--night);
    border:1px solid rgba(179,146,94,.65);
    border-radius:2px;
    box-shadow:0 12px 28px rgba(16,37,30,.18);
    cursor:pointer;
    transition:background .2s ease,transform .2s ease,opacity .2s ease;
  }

  .draw-button::before{
    content:"";
    position:absolute;
    inset:4px;
    border:1px solid rgba(243,236,217,.12);
    pointer-events:none;
  }

  .draw-button:hover:not(:disabled){
    background:var(--cinnabar-deep);
    transform:translateY(-1px);
  }

  .draw-button:active:not(:disabled){
    transform:translateY(0);
  }

  .draw-button:disabled{
    color:rgba(243,236,217,.48);
    background:#34423b;
    border-color:rgba(179,146,94,.22);
    box-shadow:none;
    cursor:not-allowed;
  }

  .draw-copy{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    line-height:1.45;
  }

  .draw-copy strong{
    font-family:var(--display);
    font-size:1.02rem;
    font-weight:500;
    letter-spacing:.13em;
  }

  .draw-copy small{
    margin-top:2px;
    color:rgba(243,236,217,.52);
    font-family:var(--sans);
    font-size:.62rem;
    letter-spacing:.12em;
  }

  .draw-glyph{
    position:relative;
    display:grid;
    place-items:center;
    width:38px;
    height:38px;
    color:var(--gold);
    border:1px solid rgba(179,146,94,.38);
    border-radius:50%;
  }

  .draw-glyph svg{
    width:18px;
    height:18px;
  }

  .draw-button.is-loading .draw-glyph{
    animation:turn 1.1s linear infinite;
  }

  .history-panel{
    margin-top:18px;
    padding:17px 4px 3px;
    border-top:1px solid rgba(228,216,191,.16);
  }

  .history-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
    color:rgba(243,236,217,.64);
    font-family:var(--sans);
    font-size:.7rem;
    letter-spacing:.16em;
  }

  .clear-history{
    padding:2px 0;
    color:rgba(179,146,94,.72);
    background:none;
    border:0;
    cursor:pointer;
    font-family:var(--sans);
    font-size:.65rem;
    letter-spacing:.1em;
  }

  .clear-history:hover{
    color:var(--paper-light);
  }

  .history-list{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    min-height:27px;
    color:rgba(243,236,217,.47);
    font-size:.78rem;
  }

  .history-chip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:3px 9px;
    color:rgba(243,236,217,.76);
    background:rgba(243,236,217,.06);
    border:1px solid rgba(179,146,94,.2);
    border-radius:2px;
    font-size:.74rem;
    letter-spacing:.04em;
  }

  .history-chip b{
    color:var(--gold);
    font-weight:400;
  }

  .page-disclaimer{
    margin:19px 4px 0;
    color:rgba(243,236,217,.4);
    font-family:var(--sans);
    font-size:.68rem;
    line-height:1.8;
  }

  .page-disclaimer strong{
    color:rgba(243,236,217,.58);
    font-weight:500;
  }

  .oracle-panel{
    position:relative;
    min-width:0;
    min-height:720px;
    overflow:hidden;
    color:var(--paper);
    background:
      linear-gradient(145deg,rgba(125,155,144,.11),transparent 42%),
      rgba(5,16,12,.24);
    border:1px solid rgba(179,146,94,.28);
    border-radius:4px;
    box-shadow:0 28px 80px rgba(0,0,0,.2),inset 0 0 0 5px rgba(243,236,217,.025);
    animation:rise-in .78s .16s cubic-bezier(.2,.8,.2,1) both;
  }

  .oracle-panel::before{
    content:"";
    position:absolute;
    inset:12px;
    z-index:0;
    border:1px solid rgba(179,146,94,.12);
    pointer-events:none;
  }

  .panel-rule{
    position:relative;
    z-index:2;
    display:flex;
    align-items:center;
    gap:13px;
    padding:16px 21px;
    color:rgba(243,236,217,.48);
    border-bottom:1px solid rgba(179,146,94,.18);
    font-family:var(--sans);
    font-size:.64rem;
    letter-spacing:.25em;
  }

  .panel-rule::before,
  .panel-rule::after{
    content:"";
    width:4px;
    height:4px;
    border:1px solid rgba(179,146,94,.45);
    transform:rotate(45deg);
  }

  .panel-rule i{
    flex:1;
    height:1px;
    background:linear-gradient(90deg,transparent,rgba(179,146,94,.2),transparent);
  }

  .empty-state{
    position:relative;
    z-index:1;
    display:flex;
    min-height:672px;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:20px 28px 48px;
    transition:opacity .32s ease,transform .32s ease;
  }

  .empty-state.hide{
    display:none;
  }

  .divination-stage{
    position:relative;
    display:grid;
    place-items:center;
    width:100%;
    min-height:405px;
    isolation:isolate;
  }

  .stage-word{
    position:absolute;
    top:48%;
    left:50%;
    z-index:-1;
    color:rgba(243,236,217,.025);
    font-family:var(--display);
    font-size:17rem;
    line-height:1;
    transform:translate(-50%,-50%);
    user-select:none;
  }

  .lotus-line{
    position:absolute;
    bottom:29px;
    left:50%;
    z-index:-1;
    width:300px;
    color:rgba(179,146,94,.26);
    transform:translateX(-50%);
  }

  .lot-tube{
    position:relative;
    width:220px;
    height:340px;
    margin-top:26px;
    filter:drop-shadow(0 26px 26px rgba(0,0,0,.3));
    transform-origin:50% 92%;
  }

  .sticks{
    position:absolute;
    left:50%;
    bottom:84px;
    z-index:1;
    width:188px;
    height:202px;
    transform:translateX(-50%);
  }

  .stick{
    position:absolute;
    bottom:0;
    left:var(--x);
    width:11px;
    height:var(--h);
    border:1px solid rgba(83,57,30,.38);
    border-radius:6px 6px 2px 2px;
    background:
      linear-gradient(90deg,rgba(102,67,31,.85) 0%,#d7b57b 28%,#f1dda8 44%,#c19455 70%,#7b5129 100%);
    box-shadow:inset 1px 0 rgba(255,255,255,.22),1px 0 4px rgba(0,0,0,.15);
    transform:rotate(var(--r));
    transform-origin:50% 100%;
  }

  .stick::before{
    content:attr(data-n);
    position:absolute;
    top:17px;
    left:50%;
    color:rgba(84,36,25,.62);
    font-family:var(--sans);
    font-size:.38rem;
    letter-spacing:-.03em;
    line-height:1;
    transform:translateX(-50%);
  }

  .stick:nth-child(1){--x:18px;--h:166px;--r:-4deg}
  .stick:nth-child(2){--x:35px;--h:192px;--r:2deg}
  .stick:nth-child(3){--x:53px;--h:174px;--r:-2deg}
  .stick:nth-child(4){--x:71px;--h:200px;--r:4deg}
  .stick:nth-child(5){--x:89px;--h:183px;--r:-1deg}
  .stick:nth-child(6){--x:107px;--h:196px;--r:2deg}
  .stick:nth-child(7){--x:125px;--h:169px;--r:-3deg}
  .stick:nth-child(8){--x:143px;--h:188px;--r:1deg}
  .stick:nth-child(9){--x:160px;--h:177px;--r:-2deg}

  .tube-rim{
    position:absolute;
    top:156px;
    left:50%;
    z-index:4;
    width:168px;
    height:38px;
    border:1px solid rgba(220,190,125,.75);
    border-radius:50%;
    background:
      radial-gradient(ellipse at center,rgba(6,17,13,.92) 0 44%,#b4935f 46% 52%,#5e482b 54% 61%,#d0ae73 63% 67%,#20392f 69%);
    box-shadow:0 5px 12px rgba(0,0,0,.28),inset 0 2px 3px rgba(255,255,255,.18);
    transform:translateX(-50%);
  }

  .tube-body{
    position:absolute;
    top:174px;
    left:50%;
    z-index:3;
    width:164px;
    height:148px;
    overflow:hidden;
    border:1px solid rgba(205,171,106,.5);
    border-radius:7px 7px 20px 20px / 6px 6px 25px 25px;
    background:
      linear-gradient(90deg,rgba(6,17,13,.98),#23493b 22%,#315b4a 48%,#1b3e32 75%,#071711 100%);
    box-shadow:inset 10px 0 18px rgba(0,0,0,.2),inset -9px 0 16px rgba(0,0,0,.3);
    transform:translateX(-50%);
  }

  .tube-body::before,
  .tube-body::after{
    content:"";
    position:absolute;
    left:0;
    width:100%;
    height:8px;
    background:linear-gradient(180deg,#d1b171,#806337 50%,#d4b87f);
    border-top:1px solid rgba(255,245,217,.34);
    border-bottom:1px solid rgba(77,51,23,.55);
  }

  .tube-body::before{top:11px}
  .tube-body::after{bottom:13px}

  .tube-label{
    position:absolute;
    top:28px;
    left:50%;
    display:flex;
    width:78px;
    height:88px;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:var(--cinnabar-deep);
    background:
      linear-gradient(110deg,rgba(255,255,255,.24),transparent 50%),
      #e9dfc8;
    border:2px solid var(--cinnabar-deep);
    box-shadow:0 2px 7px rgba(0,0,0,.22);
    transform:translateX(-50%) rotate(.8deg);
  }

  .tube-label span{
    font-family:var(--display);
    font-size:1.48rem;
    letter-spacing:.16em;
    line-height:1.3;
  }

  .tube-label small{
    margin-top:3px;
    font-family:var(--sans);
    font-size:.46rem;
    letter-spacing:.28em;
  }

  .tube-base{
    position:absolute;
    bottom:13px;
    left:50%;
    z-index:2;
    width:150px;
    height:20px;
    border-radius:50%;
    background:linear-gradient(180deg,#85683b,#2b3828);
    box-shadow:0 12px 14px rgba(0,0,0,.35);
    transform:translateX(-50%);
  }

  .empty-copy{
    margin-top:2px;
    text-align:center;
  }

  .quiet-seal{
    display:grid;
    place-items:center;
    width:32px;
    height:32px;
    margin:0 auto 12px;
    color:var(--cinnabar);
    border:1px solid rgba(164,59,41,.72);
    font-family:var(--display);
    font-size:1rem;
    line-height:1;
    transform:rotate(-3deg);
  }

  .oracle-verse{
    margin:0;
    color:var(--paper-light);
    font-family:var(--display);
    font-size:1.28rem;
    letter-spacing:.17em;
    line-height:1.7;
  }

  .oracle-hint{
    margin:8px 0 0;
    color:rgba(243,236,217,.44);
    font-size:.84rem;
    letter-spacing:.08em;
  }

  .oracle-panel.is-drawing .lot-tube{
    animation:tube-shake .12s linear infinite alternate;
  }

  .oracle-panel.is-drawing .stick{
    animation:stick-peek .28s ease-in-out infinite alternate;
    animation-delay:calc(var(--x) * -3ms);
  }

  .oracle-panel.is-drawing .oracle-verse{
    opacity:.4;
  }

  .result{
    position:relative;
    z-index:1;
    display:none;
    padding:26px 28px 30px;
  }

  .result.show{
    display:block;
    animation:ink-reveal .55s cubic-bezier(.18,.78,.22,1) both;
  }

  .sign-paper{
    position:relative;
    overflow:hidden;
    padding:32px 32px 26px;
    color:var(--ink);
    background:
      linear-gradient(110deg,rgba(255,255,255,.48),transparent 38%),
      var(--paper);
    border-radius:2px;
    box-shadow:0 20px 60px rgba(0,0,0,.26);
  }

  .sign-paper::before{
    content:"";
    position:absolute;
    inset:8px;
    pointer-events:none;
    border:1px solid rgba(111,90,55,.18);
  }

  .sign-paper::after{
    content:"";
    position:absolute;
    inset:0;

        </p>
      </div>

        <div class="panel-rule">

          <i></i>
          <span>签在静中</span>

          </div>

          <div class="empty-copy">
            <div class="quiet-seal" aria-hidden="true">靜</div>
            <p class="oracle-verse">心有所惑，先静其神</p>
            <p class="oracle-hint">一签只问一事，得一解，且行且观。</p>
          </div>
        </div>

        <div class="result" id="result" aria-live="polite"></div>
      </section>
    </main>
  </div>

  "raw": "第五十首：三寶太監下西洋　　　大吉　　　 　　　\n五湖四海盡行船，高掛風帆把舵堅　　\n幸得順風隨所至，滿船寶貝稱心田　　\n（四句淺釋：五湖四海都可以駕船遨遊，揚起風帆穩住船舵；所到之處皆能得到順風相送，船上滿滿的收穫令人歡心喜悅。）　\n自在優游，不須著力，財源重重，無不惟悅。此籤順風行船之象，凡事和合大吉。　\n靈籤之曰：本籤曰。五湖四海盡行船。高掛風帆把舵堅。如三寶太監。鄭和之行之於南洋也。只要把舵牢住。必可揚德威於異域者。為順風行船之象。凡事和合大吉者。雖大吉之籤。百事興。唯必留心正應。反應之不同。易言之。本籤者自在優游。不須著力。財源重重。無不惟悅者。　\n交易－宜遲　婚姻－不合　求財－西方　自身－吉　家宅－利　六畜－春旺　田蠶－秋利　尋人－至　行人－阻　六甲－安　山墳－南利　訟詞－虧　疾病－解　失物－西方　移徒－守舊"

  "raw": "第七十首：諸葛與關公說親　　　\n朝朝役役恰如蜂，飛來飛去西復東　\n春暮花殘無覓處，此身不戀舊叢中　\n（四句淺釋：猶如成日勞苦奔波的蜂兒，自東向西，又自西向東地飛來飛去；但是春殘花謝，哪裡還找得到蜜可採呢？就不必再一心眷戀舊花叢了吧！）\n役役終朝，暗雨不清，用盡機謀，爭加寂寞。此籤遊蜂採花之象，凡事勞而無功。\n靈籤之曰：本籤者遊蜂採花之象。凡事勞而無功者。飛來飛去而復東。春屆暮節花殘也無其覓處。棲身之所。交易。婚姻。求財。六畜。生產。皆無一是處。在此苦境之時。最宜修吾身。積吾善。行布施。善吾之言行。方能有轉機。易言之。役役終朝暗雨不清用盡機謀爭加寂寞者。\n交易－反覆　婚姻－不久長　求財－破耗　自身－小人　家宅－口舌　六畜－損　田蠶－損　尋人－無跡　行人－杳　六甲－虛花　山墳－改　訟詞－虧　疾病－阻　失物－空　移徒－守舊"

  "raw": "第九十八首：陶淵明三徑關門　　\n經商出入事遲疑，恐惹閑愁與是非　　\n如鳥飛投羅網陷，相看能有幾人知　\n(四句淺釋：經商求謀疑東疑西，恐怕遭致不必要的困擾與是非；就似飛鳥陷入羅網之中，這種情境能有幾人了解呢？）\n禽遭羅網，有理難分，隨緣守舊，遇貴乃成。此籤禽遭羅網之象，凡事守舊則安。\n靈籤之曰：本籤者。禽遭羅網之象。凡百事守舊可獲安者。詩曰。經商出入事遲疑。也因此惹閑愁。不必要之愁爭。聽了是是非非。謠言四播。逢遇如此羅網苦境中。必須多修福。積德方能脫離險境者耶。易言之。君之今也。禽遭羅網有理難分。隨緣守舊遇貴乃成之命耶。　\n交易－損失　婚姻－不長　求財－破財　自身－小人　家宅－憂疑　六畜－損　田蠶－損　尋人－杳　行人－困難　六甲－刑傷　山墳－絕　訟詞－虧　疾病－羅網　失物－凶　移徒－勿動"

  "raw": "第一百首：楚襄王陽臺夢醒　 　\n欲就東兮欲就西，逢人說事轉癡迷　\n登山不見神仙面，莫若歸休更勿提　\n（四句淺釋：一下想往東，一下又想要向西，遇人說話反覆無常；就似爬上了高山，終究找不到神仙的蹤影，倒不如回去吧，別再提這件事了。）\n此籤及百，祈之未然，營謀用事，費力流連。此籤無常無定之象，凡事多虛少實。　\n靈籤之曰：本籤者。無常無定之象。外虛少實者也。第一百首。是盈數。為全數之末。亦即言。它是前數之終。後數之始。易言之。黑暗將去。黎明到來之徵。表面上是沒落之相。其實是通亨衢之意。唯集福之本。宜小心集之。及百祈之未然營謀用事費力流連。"

</script>
  <script>
  (function(){
    "use strict";

    const CATS = {
      "感情婚姻": ["婚姻"],
      "事业财运": ["交易", "求財", "求财", "自身"],
      "健康心态": ["疾病", "自身"],
      "家庭关系": ["家宅", "六畜"],
      "纠纷诉讼": ["訟詞", "讼词"],
      "出行搬迁": ["行人", "移徒", "移徙", "移徏"],
      "寻人失物": ["尋人", "寻人", "失物"],
      "生育": ["六甲"]
    };

    const STORAGE_KEY = "gysign_hist";
    const catBox = document.getElementById("cats");
    const drawBtn = document.getElementById("drawBtn");
    const drawLabel = document.getElementById("drawLabel");
    const drawHint = document.getElementById("drawHint");
    const questionInput = document.getElementById("question");
    const questionCount = document.getElementById("questionCount");
    const resultBox = document.getElementById("result");
    const emptyState = document.getElementById("emptyState");
    const oraclePanel = document.getElementById("oraclePanel");
    const histBox = document.getElementById("hist");
    const clearHistoryBtn = document.getElementById("clearHistory");

    let selectedCat = null;
    let drawing = false;

    function escapeHtml(value){
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function readHistory(){
      try{
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        return Array.isArray(data) ? data.slice(0, 10) : [];
      }catch(error){
        return [];
      }
    }

    function writeHistory(history){
      try{
        localStorage.setItem(STORAGE_KEY, JSON.stringify(history.slice(0, 10)));
      }catch(error){
        // The reading remains usable when storage is unavailable.
      }
    }

    function renderHistory(){
      const history = readHistory();
      clearHistoryBtn.hidden = history.length === 0;

      if (!history.length){
        histBox.textContent = "尚无记录";
        return;
      }

      histBox.innerHTML = history.map((entry) => `
        <span class="history-chip" title="${escapeHtml(entry.title || "")}">
          <b>第${escapeHtml(entry.id)}签</b>${escapeHtml(entry.cat)}
        </span>
      `).join("");
    }

    function normalizeKey(key){
      return String(key)
        .replace(/財/g, "财")
        .replace(/詞/g, "词")
        .replace(/尋/g, "寻")
        .replace(/徏/g, "徙");
    }

    function pickItems(sign, category){
      const wanted = (CATS[category] || []).map(normalizeKey);
      const items = [];

      Object.entries(sign.items || {}).forEach(([key, value]) => {
        if (wanted.includes(normalizeKey(key))){
          items.push({ key, value });
        }
      });

      return items;
    }

    function interpret(sign, items){
      const level = sign.level || "";
      const values = items.map((item) => item.value).join(" ");
      const fullText = `${values} ${sign.xiang || ""} ${sign.commentary || ""}`;

      const good = /上上|大吉|上吉|中上|中吉|上$/.test(level);
      const soft = /中平|中中|平平|中$|平$/.test(level);
      const bad = /下下|下|凶/.test(level);
      const hasGood = /吉|成|合|利|旺|安|胜|見|见|至|得|好|順|顺|如意|成交|就/.test(values);
      const hasBad = /难|難|阻|亏|虧|凶|损|損|不利|欠|破|空|滞|滯|危|惊|驚|未合|不就|未成/.test(values);
      const wait = /待時|待时|宜遲|宜迟|守舊|守旧|守份|谨慎|謹慎|忍耐/.test(fullText);
      const noble = /貴人|贵人|高人|良匠/.test(fullText);

      let tone = "签意中性，更多取决于你接下来的选择与准备。";
      if (good && !hasBad) tone = "整体象意偏顺，所问之事有推进空间。";
      else if (good && hasBad) tone = "整体偏吉，但你所问的这一项有需要留意之处，不宜只看总评。";
      else if (soft) tone = "这一签偏向「暂缓与观察」，不是否定，而是提示节奏。";
      else if (bad || hasBad) tone = "这一签提示阻力较多，宜降低预期、先求稳。";

      let action = "不妨把签意转成一次自问：此刻最值得守住的是什么，下一步最小的行动又是什么。";
      if (wait) action = "签中反复出现「守旧、待时、忍耐」，可理解为：先不急着做不可逆的决定，把信息补齐、把情绪放稳，再行动。";
      else if (noble) action = "签中提到「贵人、高人」，可转成一个具体动作：找一位你信得过、有经验的人请教，而不是独自反复纠结。";
      else if (hasGood) action = "可把「顺」理解为一个窗口：列出下一步最小可行的一步，先做起来，再根据反馈调整。";
      else if (hasBad) action = "可把「阻」理解为风险清单：把最坏情况写下来，逐项准备应对，避免在情绪高点做决定。";

      return { tone, action };
    }

    function levelClass(level){
      if (!level) return "is-low";
      if (/上|吉/.test(level)) return "";
      if (/下|凶/.test(level)) return "is-low";
      return "is-mid";
    }

    function drawIndex(length){
      if (!window.crypto || typeof window.crypto.getRandomValues !== "function"){
        return Math.floor(Math.random() * length);
      }

      const buffer = new Uint32Array(1);
      const limit = Math.floor(0xFFFFFFFF / length) * length;
      let value;

      do{
        window.crypto.getRandomValues(buffer);
        value = buffer[0];
      }while (value >= limit);

      return value % length;
    }

    function renderSign(sign, category, question){
      const items = pickItems(sign, category);
      const reading = interpret(sign, items);
      const levelText = sign.level || "原本未标";
      const safeQuestion = question ? escapeHtml(question) : "";
      const poem = (sign.poem || []).map((line) =>
        `<div class="poem-line">${escapeHtml(line)}</div>`
      ).join("");

      const itemMarkup = items.length
        ? items.map((item) => `
            <div class="item-row">
              <span class="item-key">${escapeHtml(item.key)}</span>
              <span class="item-value">${escapeHtml(item.value)}</span>
            </div>
          `).join("")
        : `
            <div class="item-row">
              <span class="item-key">此项</span>
              <span class="item-value">此本未列，宜参考整体象意</span>
            </div>
          `;

      resultBox.innerHTML = `
        <article class="sign-paper">
          <div class="paper-topline">慈航普渡 · 静观己心</div>

          <header class="sign-header">
            <div class="number-seal">
              <span>第</span>
              <strong>${escapeHtml(sign.id)}</strong>
              <span>签</span>
            </div>
            <div class="title-wrap">
              <p>觀音靈籤</p>
              <h2>${escapeHtml(sign.title)}</h2>
              <span class="level-tag ${levelClass(sign.level)}">${escapeHtml(levelText)}</span>
            </div>
            <div class="title-stamp" aria-hidden="true">觀音<br>靈籤</div>
          </header>

          <div class="poem-block">
            ${poem}
            ${sign.xiang ? `<p class="xiang">${escapeHtml(sign.xiang)}</p>` : ""}
          </div>

          <div class="query-echo">
            <span>所问</span>
            <p>${escapeHtml(category)}${safeQuestion ? ` · ${safeQuestion}` : ""}</p>
          </div>

          <section class="reading-section" aria-label="${escapeHtml(category)}对应断语">
            <div class="reading-title">
              <b>断</b>
              <h3>${escapeHtml(category)}所应</h3>
            </div>
            <div class="item-grid">${itemMarkup}</div>
          </section>

          <div class="advice">
            <span class="advice-mark" aria-hidden="true">劝</span>
            <p>${escapeHtml(reading.tone)}</p>
            <p>${escapeHtml(reading.action)}</p>
          </div>

          ${sign.gloss || sign.commentary ? `
            <div class="detail-stack">
              ${sign.gloss ? `
                <details class="detail-item">
                  <summary>四句浅释</summary>
                  <p>${escapeHtml(sign.gloss)}</p>
                </details>
              ` : ""}
              ${sign.commentary ? `
                <details class="detail-item">
                  <summary>灵签之曰</summary>
                  <p>${escapeHtml(sign.commentary)}</p>
                </details>
              ` : ""}
            </div>
          ` : ""}

          <p class="result-note">签文为民间流传整理本，未作严格校勘；解读仅作支持性反思提示，并非预测。</p>
        </article>
      `;

      emptyState.classList.add("hide");
      resultBox.classList.add("show");
      oraclePanel.querySelector(".panel-rule span:first-child").textContent = `第${sign.id}签`;

      const history = readHistory();
      history.unshift({
        id: sign.id,
        title: sign.title,
        cat: category,
        t: Date.now()
      });
      writeHistory(history);
      renderHistory();

      requestAnimationFrame(() => {
        resultBox.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    }

    function renderCategories(){
      Object.keys(CATS).forEach((name, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "cat";
        button.setAttribute("aria-pressed", "false");
        button.innerHTML = `
          <span class="cat-index">${String(index + 1).padStart(2, "0")}</span>
          <span class="cat-name">${escapeHtml(name)}</span>
        `;
        button.addEventListener("click", () => {
          catBox.querySelectorAll(".cat").forEach((item) => {
            item.classList.remove("on");
            item.setAttribute("aria-pressed", "false");
          });
          button.classList.add("on");
          button.setAttribute("aria-pressed", "true");
          selectedCat = name;
          drawBtn.disabled = false;
          drawHint.textContent = "签筒已候";
        });
        catBox.appendChild(button);
      });
    }

    function resetDrawButton(){
      drawing = false;
      drawBtn.classList.remove("is-loading");
      oraclePanel.classList.remove("is-drawing");
      oraclePanel.removeAttribute("aria-busy");
      drawBtn.disabled = !selectedCat;
      drawLabel.textContent = "静心，抽一签";
      drawHint.textContent = selectedCat ? "签筒已候" : "先择所问之事";
    }

    function startDraw(){
      if (drawing || !selectedCat) return;

      if (!window.SIGNS || !window.SIGNS.length){
        alert("签库未加载，请确认 data.js 与 index.html 位于同一目录。");
        return;
      }

      drawing = true;
      const sign = window.SIGNS[drawIndex(window.SIGNS.length)];
      const question = questionInput.value.trim().slice(0, 60);
      const category = selectedCat;

      drawBtn.disabled = true;
      drawBtn.classList.add("is-loading");
      drawLabel.textContent = "静候签应";
      drawHint.textContent = "心定，则签明";
      oraclePanel.classList.add("is-drawing");
      oraclePanel.setAttribute("aria-busy", "true");

      window.setTimeout(() => {
        renderSign(sign, category, question);
        resetDrawButton();
      }, 920);
    }

    drawBtn.addEventListener("click", startDraw);

    questionInput.addEventListener("input", () => {
      questionCount.textContent = `${questionInput.value.length} / 60`;
    });

    questionInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && (event.ctrlKey || event.metaKey)){
        event.preventDefault();
        startDraw();
      }
    });

    clearHistoryBtn.addEventListener("click", () => {
      writeHistory([]);
      renderHistory();
      clearHistoryBtn.textContent = "已清空";
      window.setTimeout(() => {
        clearHistoryBtn.textContent = "清空";
      }, 900);
    });

    renderCategories();
    renderHistory();
  })();
  </script>
